spring.application.name=api-gateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Atualiza a lista de instancias com frequencia (instancias novas e paradas aparecem logo)
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# Rotas dinamicas: /<nome-do-servico-no-eureka>/** -> lb://<nome-do-servico>
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Rotas explicitas (balanceadas pelo Load Balancer via Eureka, sem URL fixa)
spring.cloud.gateway.server.webflux.routes[0].id=ms-obras
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-obras
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/obras/**,/api/v1/artistas/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-contribuicoes
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-contribuicoes
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/contribuicoes/**

# Swagger UI unico (http://localhost:8082/swagger-ui.html) com a documentacao dos dois microsservicos.
# Os /v3/api-docs sao buscados pelo proprio Gateway via Eureka (rota dinamica /<servico>/**).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=ms-obras
springdoc.swagger-ui.urls[0].url=/ms-obras/v3/api-docs
springdoc.swagger-ui.urls[1].name=ms-contribuicoes
springdoc.swagger-ui.urls[1].url=/ms-contribuicoes/v3/api-docs
springdoc.swagger-ui.urls-primary-name=ms-obras

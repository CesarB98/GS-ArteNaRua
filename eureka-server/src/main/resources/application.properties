spring.application.name=eureka-server

server.port=8761

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:${server.port}/eureka/

# Ambiente de desenvolvimento: remove rapido do registro as instancias que cairam.
# Sem isso, com poucos servicos o Eureka entra em modo de auto-preservacao e mantem
# instancias mortas como UP, e o Gateway continua tentando chamar a instancia parada.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
